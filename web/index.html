<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEECE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171513" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sonarly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the CSS cache before the stylesheet link parses; identical URL,
      so the stylesheet below reuses this fetch (no double download). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-hydration appearance bootstrap. Must agree with
      // resolveAppearanceAttributes in web/src/lib/appearance.ts: same key,
      // same accepted values, same defaults, so the first paint matches what
      // the store applies at hydration (no accent/mode flip). The parity
      // test (src/appearance-bootstrap-parity.test.ts) executes both
      // implementations against a scenario matrix and fails on drift.
      (function () {
        var ACCENTS = ['copper', 'green', 'purple', 'blue', 'monochrome'];
        var mode = 'auto';
        var accent = 'copper';
        try {
          var stored = window.localStorage.getItem('sonarly-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'oled') {
            mode = stored; // legacy bare-mode string
          } else if (stored) {
            try {
              var parsed = JSON.parse(stored);
              if (parsed && typeof parsed === 'object') {
                if (
                  parsed.mode === 'auto' ||
                  parsed.mode === 'light' ||
                  parsed.mode === 'dark' ||
                  parsed.mode === 'oled'
                ) {
                  mode = parsed.mode;
                }
                if (ACCENTS.indexOf(parsed.accent) !== -1) {
                  accent = parsed.accent;
                }
              }
            } catch (e) {}
          }
        } catch (e) {}
        var resolved =
          mode === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        var root = document.documentElement;
        root.dataset.theme = resolved === 'oled' ? 'dark' : resolved;
        if (resolved === 'oled') root.dataset.oled = 'true';
        root.dataset.accent = accent;
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
