  /api/admin/system-tasks/history:
    get:
      operationId: systemTaskHistory
      tags: [admin]
      summary: System task run history, paginated (admin)
      description: >
        The only paginated endpoint; the page/limit/total/totalPages shape
        is preserved. `page` defaults to 1, `limit` to 10 (max 100).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: One history page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemTaskHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/system-tasks/{taskId}/run:
    post:
      operationId: runSystemTask
      tags: [admin]
