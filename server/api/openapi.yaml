# Sonarly — native REST API contract.
#
# Hand-authored from the Go route registry (cmd/sonarly/mountRoutes) and
# the modules' JSON DTOs. cmd/sonarly/spec_test.go walks the chi router and
# asserts this spec documents exactly the registered /api routes — the spec
# cannot drift from the code silently.
#
# Wire conventions:
#   - All JSON is camelCase; field names match the Go DTO tags exactly.
#   - Every non-2xx response is the error contract: {"error": string}.
#   - Auth: signed `sessionId` cookie (HttpOnly, SameSite=Strict) OR the
#     `X-API-Key` header on ordinary /api routes. /api/events is
#     session-cookie-only (EventSource cannot set headers).
#   - /api/stream/{id} and /api/events are exempt from the global 60s API
#     timeout (long-lived by design).
openapi: 3.1.0
info:
  title: Sonarly API
  version: 2.0.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: >
    Native REST API of the Sonarly Go server. Documented routes
    are the native /api surface plus the /health, /healthz and /ready
    liveness probes;
    the OpenSubsonic adapter under /rest is a separate (Subsonic-compatible)
    contract and is intentionally not part of this spec.

    Error contract: every non-2xx response body is `{"error": "..."}` with a
    generic message for 5xx (driver errors never reach the client).
servers:
  - url: /
# Default auth: the signed sessionId cookie OR the X-API-Key header.
# Public operations override with `security: []`; /api/events overrides with
# session-cookie-only (EventSource cannot set headers).
security:
  - sessionId: []
  - apiKey: []
tags:
  - name: system
    description: Liveness and readiness probes.
  - name: auth
    description: Login, logout, first-run setup, and the caller's own profile.
  - name: users-admin
    description: Admin-only user management.
  - name: catalog
    description: Songs, albums, artists, genres, years, and cover art.
  - name: playlists
    description: Static and smart playlists, per-user shares, and share links.
  - name: playback
    description: Streaming, scrobbling, and bookmarks.
  - name: library
    description: Scan enqueueing and job status.
  - name: search
    description: Full-text search across the catalog and playlists.
  - name: statistics
    description: Listening statistics, per-user and server-wide.
  - name: home
    description: Landing-page aggregation.
  - name: auto-dj
    description: Automatic DJ candidate generation.
  - name: interactions
    description: Per-user favorites (stars) and ratings on catalog entities — the same user_* junction rows the OpenSubsonic adapter writes.
  - name: players
    description: Live now-playing dashboard.
  - name: events
    description: Server-sent events feed.
  - name: uploads
    description: Chunked uploads into the ingest pipeline.
  - name: ingest
    description: Ingest history and duplicate-conflict cleanup, media settings, and the organize routes.
  - name: libraries
    description: Library administration and the user↔library assignment endpoints.
  - name: tags
    description: Song/album tag editing and cover-art upload — the mutagen-backed write path.
  - name: providers
    description: Admin proxies for external metadata providers (MusicBrainz, LRCLIB).
  - name: admin
    description: Admin dashboard — system tasks, status counters, missing-file management, ingest runs.
paths:
  /health:
    get:
      operationId: healthCheck
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /healthz:
    get:
      operationId: healthCheckContainer
      tags: [system]
      summary: Liveness probe alias (container HEALTHCHECK; same handler as /health)
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/client-errors:
    post:
      operationId: reportClientError
      tags: [system]
      summary: Client-side crash reporting (anonymous)
      description: >
        The web ErrorBoundary, window.onerror and unhandledrejection POST
        here so production render crashes are diagnosable from server logs.
        Fire-and-forget; the response is never user-visible.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                stack: { type: string }
                route: { type: string }
      responses:
        '200':
          description: Report logged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /ready:
    get:
      operationId: readinessCheck
      tags: [system]
      summary: Readiness probe (database ping)
      security: []
      responses:
        '200':
          description: Database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        '503':
          description: Database not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in (issues the signed session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated; session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/PublicUser' }
        '400':
          description: Malformed JSON body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Invalid credentials (unknown username and wrong password are indistinguishable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many failed attempts for this ip:username pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (always answers ok; destroys any presented session)
      description: >
        Exempt from auth, as before: always answers `{ok: true}` and expires the
        session cookie, destroying whatever session was presented, if any.
      security: []
      responses:
        '200':
          description: Logged out (or nothing to log out).
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /api/setup:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: First-run setup status
      security: []
      responses:
        '200':
          description: Whether the zero-users setup gate is open.
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup]
                properties:
                  needsSetup: { type: boolean }
        '500':
          description: Internal failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: setup
      tags: [auth]
      summary: Create the first admin (only while no users exist)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                name: { type: string }
                surname: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: First admin created; session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/PublicUser' }
        '400':
          description: Validation failure (missing username/password, password shorter than 8 chars).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Setup already completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user's public profile
      responses:
        '200':
          description: The caller's user row.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/PublicUser' }
        '401':
          description: No (or dead) session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/me/preferences:
    get:
      operationId: getMyPreferences
      tags: [auth]
      summary: Current user's preferences document
      description: >
        The stored preferences merged over the shared defaults (an absent row
        or a corrupt blob yields the defaults). Persisted verbatim keys
        (theme, sidebar layout, view options) ride along with the validated
        auto-dj and appearance keys.
      responses:
        '200':
          description: The merged preferences document.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: patchMyPreferences
      tags: [auth]
      summary: Update current user's preferences (allowlisted keys)
      description: >
        Partial update: every key in the body must be in the explicit
        allowlist (auto-dj knobs, appearance, hideSponsorButton, and the
        structural sidebar/theme documents) or the whole patch is rejected
        with 400 — unknown keys are never silently dropped or stored
        (mass-assignment fix). Values are validated per key; out-of-range
        out-of-range auto-dj numbers clamp instead of failing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesPatch' }
      responses:
        '200':
          description: The merged document after the patch.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/favorites:
    post:
      operationId: setFavorite
      tags: [interactions]
      summary: Star or unstar a song, album, artist, or playlist
      description: >
        Upserts the caller's starred flag in the user_songs / user_albums /
        user_artists / user_playlists junction row — the same tables the
        OpenSubsonic star.view/unstar.view endpoints write (playlists
        excepted, which the Subsonic API does not star).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Exactly one entity: a per-type id key (songId, albumId,
                artistId, playlistId) OR the legacy {entityType,
                entityId} form with entityType song|album|artist|playlist.
              properties:
                songId: { type: string }
                albumId: { type: string }
                artistId: { type: string }
                playlistId: { type: string }
                entityType:
                  type: string
                  enum: [song, album, artist, playlist]
                entityId: { type: string }
                entityID: { type: string }
                starred:
                  type: boolean
                  default: true
                  description: Absent means favorite (true).
      responses:
        '200':
          description: Favorite stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/ratings:
    post:
      operationId: setRating
      tags: [interactions]
      summary: Rate a song, album, artist, or playlist (0..5 in 0.5 steps)
      description: >
        Upserts the caller's rating in the user_* junction row; song ratings
        recompute songs.average_rating. Passing null (or omitting the key)
        Passing null (or omitting the key) clears the rating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Exactly one entity: a per-type id key (songId, albumId,
                artistId, playlistId) OR the legacy {entityType,
                entityId} form with entityType song|album|artist|playlist.
              properties:
                songId: { type: string }
                albumId: { type: string }
                artistId: { type: string }
                playlistId: { type: string }
                entityType:
                  type: string
                  enum: [song, album, artist, playlist]
                entityId: { type: string }
                entityID: { type: string }
                rating:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 5
                  multipleOf: 0.5
                  description: 0..5 in 0.5 increments; null clears.
      responses:
        '200':
          description: Rating stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/avatars/{id}:
    get:
      operationId: getAvatar
      tags: [auth]
      summary: User avatar image
      security: []
      description: >
        Serves the user's avatar file when one has been uploaded; 404
        otherwise. Publicly readable — avatars render in <img> tags, which
        carry no API key.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The avatar bytes (Content-Type by stored extension).
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/gif: {}
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users:
    get:
      operationId: listUsers
      tags: [users-admin]
      summary: List all users (admin)
      responses:
        '200':
          description: Every user, public shape.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/PublicUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [users-admin]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                isAdmin: { type: boolean }
                name: { type: string }
                surname: { type: string }
                email: { type: string, format: email }
                maxBitrateKbps:
                  type: integer
                  minimum: 64
                  maximum: 320
                transcodeFormat: { $ref: '#/components/schemas/TranscodeFormat' }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Username already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/admin/users/{id}:
    put:
      operationId: updateUser
      tags: [users-admin]
      summary: Update a user (admin)
      description: >
        Pointer fields are absent (untouched) vs present (applied).
        `name`, `surname`, `email`, `maxBitrateKbps`, `transcodeFormat`,
        `hideExplicit`, `blurExplicitTitles` and `blurExplicitCovers`
        additionally accept explicit `null`, which clears the stored value;
        `isAdmin` and `password` treat absent and null alike (untouched). A
        role or password change invalidates every session of the target user.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateInput' }
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would demote/delete the last admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteUser
      tags: [users-admin]
      summary: Delete a user (admin; not yourself, not the last admin)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User and sessions deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Self-delete, or deleting the last admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/songs:
    get:
      operationId: listSongs
      tags: [catalog]
      summary: List songs (filters optional, library-scoped)
      parameters:
        - { name: albumId, in: query, schema: { type: string }, description: Filter by album. }
        - { name: artistId, in: query, schema: { type: string }, description: Filter by primary artist. }
        - { name: genreId, in: query, schema: { type: string }, description: Filter by genre. }
        - { name: libraryId, in: query, schema: { type: string }, description: Narrow to one library. }
        - { name: hideExplicit, in: query, schema: { type: boolean }, description: Drop explicit songs. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        '200':
          description: Matching songs (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [songs]
                properties:
                  songs:
                    type: array
                    items: { $ref: '#/components/schemas/Song' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/songs/{id}:
    get:
      operationId: getSong
      tags: [catalog]
      summary: One song
      parameters:
        - $ref: '#/components/parameters/SongId'
      responses:
        '200':
          description: The song.
          content:
            application/json:
              schema:
                type: object
                required: [song]
                properties:
                  song: { $ref: '#/components/schemas/Song' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/albums:
    get:
      operationId: listAlbums
      tags: [catalog]
      summary: List albums (filters optional, library-scoped)
      parameters:
        - { name: artistId, in: query, schema: { type: string } }
        - { name: genreId, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: hideExplicit, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        '200':
          description: Matching albums (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [albums]
                properties:
                  albums:
                    type: array
                    items: { $ref: '#/components/schemas/Album' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/albums/{id}:
    get:
      operationId: getAlbum
      tags: [catalog]
      summary: Album detail with its songs
      parameters:
        - $ref: '#/components/parameters/AlbumId'
        - { name: hideExplicit, in: query, schema: { type: boolean }, description: Exclude explicit songs from the song list (and ShownSongCount). }
      responses:
        '200':
          description: The album plus its in-scope songs.
          content:
            application/json:
              schema:
                type: object
                required: [album, songs]
                properties:
                  album: { $ref: '#/components/schemas/Album' }
                  songs:
                    type: array
                    items: { $ref: '#/components/schemas/Song' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/artists:
    get:
      operationId: listArtists
      tags: [catalog]
      summary: List artists (library-scoped)
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching artists (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [artists]
                properties:
                  artists:
                    type: array
                    items: { $ref: '#/components/schemas/Artist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/artists/{id}:
    get:
      operationId: getArtist
      tags: [catalog]
      summary: Artist detail with songs (albums ride the artist payload)
      parameters:
        - $ref: '#/components/parameters/ArtistId'
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: hideExplicit, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: The artist (with its `albums` cards) plus in-scope songs.
          content:
            application/json:
              schema:
                type: object
                required: [artist, songs]
                properties:
                  artist: { $ref: '#/components/schemas/Artist' }
                  songs:
                    type: array
                    items: { $ref: '#/components/schemas/Song' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/artists/{id}/songs:
    get:
      operationId: listArtistSongs
      tags: [catalog]
      summary: All songs by one artist
      parameters:
        - $ref: '#/components/parameters/ArtistId'
        - { name: hideExplicit, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: The artist's songs (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [songs]
                properties:
                  songs:
                    type: array
                    items: { $ref: '#/components/schemas/Song' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/genres:
    get:
      operationId: listGenres
      tags: [catalog]
      summary: Flat genre list with resolved paths
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Genres with their `Parent > Child` path (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [genres]
                properties:
                  genres:
                    type: array
                    items: { $ref: '#/components/schemas/Genre' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/genres/tree:
    get:
      operationId: getGenreTree
      tags: [catalog]
      summary: Genre hierarchy
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Forest of genre nodes; `children` is always present (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [tree]
                properties:
                  tree:
                    type: array
                    items: { $ref: '#/components/schemas/GenreNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/genres/{id}/albums:
    get:
      operationId: listGenreAlbums
      tags: [catalog]
      summary: Album cards for one genre
      parameters:
        - $ref: '#/components/parameters/GenreId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 4 } }
        - { name: hideExplicit, in: query, schema: { type: boolean } }
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Albums in the genre (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [albums]
                properties:
                  albums:
                    type: array
                    items: { $ref: '#/components/schemas/Album' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/years:
    get:
      operationId: listYears
      tags: [catalog]
      summary: Distinct song years with counts, newest first
      responses:
        '200':
          description: Distinct years of in-scope active songs and how many songs carry each.
          content:
            application/json:
              schema:
                type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items: { $ref: '#/components/schemas/YearCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/cover-art/{id}:
    get:
      operationId: getCoverArt
      tags: [catalog]
      summary: Cover art blob
      parameters:
        - $ref: '#/components/parameters/CoverArtId'
      responses:
        '200':
          description: The image bytes, private-cacheable for a day.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, max-age=86400' }
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: List playlists visible to the caller
      description: >
        `shareToken` is populated only for the playlist's owner: other
        viewers authorize with it but never see it.
      responses:
        '200':
          description: Visible playlists (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [playlists]
                properties:
                  playlists:
                    type: array
                    items: { $ref: '#/components/schemas/PlaylistListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create a playlist (static, or smart when `rules` is present)
      description: >
        A body with `rules` creates a smart playlist; the old explicit
        `isSmart` flag is folded into rules presence. `visibility` defaults
        per service rules when omitted; `resolveMode` defaults to `tracks`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                visibility: { $ref: '#/components/schemas/PlaylistVisibility' }
                songIds:
                  type: array
                  items: { type: string }
                rules: { $ref: '#/components/schemas/SmartPlaylistRules' }
                resolveMode: { $ref: '#/components/schemas/ResolveMode' }
      responses:
        '201':
          description: Created playlist.
          content:
            application/json:
              schema:
                type: object
                required: [playlist]
                properties:
                  playlist: { $ref: '#/components/schemas/PlaylistDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/playlists/{id}:
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Playlist detail with resolved entries
      description: >
        `shares` and `shareToken` are owner-only. The `shareToken` query
        parameter authorizes non-owner access to link-shared playlists.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - { name: shareToken, in: query, schema: { type: string }, description: 'Link-share token (for viewers, not the owner).' }
      responses:
        '200':
          description: The playlist detail.
          content:
            application/json:
              schema:
                type: object
                required: [playlist]
                properties:
                  playlist: { $ref: '#/components/schemas/PlaylistDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update a playlist (every field optional)
      description: >
        `rules` present (including explicit null) re-parses the smart rules;
        `songIds` present replaces the membership.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                visibility: { $ref: '#/components/schemas/PlaylistVisibility' }
                songIds:
                  type: array
                  items: { type: string }
                isSmart: { type: boolean }
                rules:
                  anyOf:
                    - { $ref: '#/components/schemas/SmartPlaylistRules' }
                    - { type: 'null' }
                resolveMode: { $ref: '#/components/schemas/ResolveMode' }
      responses:
        '200':
          description: Updated playlist.
          content:
            application/json:
              schema:
                type: object
                required: [playlist]
                properties:
                  playlist: { $ref: '#/components/schemas/PlaylistDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/playlists/{id}/albums:
    get:
      operationId: listPlaylistCoverAlbums
      tags: [playlists]
      summary: Distinct albums behind the playlist cover mosaic
      description: >
        Up to `limit` distinct albums from the playlist's songs, in playlist
        order — the 2x2 cover grid the playlist cards and detail header
        render. Access matches the playlist detail (a shareToken admits
        anonymous viewers).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, default: 4, minimum: 1, maximum: 20 }
        - name: shareToken
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Albums for the cover grid (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [albums]
                properties:
                  albums:
                    type: array
                    items: { $ref: '#/components/schemas/CoverAlbum' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/playlists/{id}/share:
    post:
      operationId: sharePlaylist
      tags: [playlists]
      summary: Share a playlist with a user (owner)
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                canEdit: { type: boolean }
      responses:
        '200':
          description: Shared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/playlists/{id}/share/{userId}:
    delete:
      operationId: unsharePlaylist
      tags: [playlists]
      summary: Revoke a user's share (owner)
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/ShareUserId'
      responses:
        '200':
          description: Share revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/playlists/{id}/share-link:
    post:
      operationId: createPlaylistShareLink
      tags: [playlists]
      summary: Create (or return) the link-share token (owner)
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: The share token.
          content:
            application/json:
              schema:
                type: object
                required: [shareToken]
                properties:
                  shareToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePlaylistShareLink
      tags: [playlists]
      summary: Revoke the link-share token (owner)
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/stream/{id}:
    get:
      operationId: streamSong
      tags: [playback]
      summary: Stream a song (direct or transcoded)
      description: >
        Anonymous callers may stream with a valid `share` token (the linked
        playlist's songs); anonymous without a token gets 401; a known token
        whose playlist does not contain the song gets 404. Direct streams
        honor Range requests; transcodes (when `maxBitRate` forces one, and
        never with `download`) are plain 200s. The route is exempt from the
        global API timeout.
      parameters:
        - $ref: '#/components/parameters/SongId'
        - { name: maxBitRate, in: query, schema: { type: integer }, description: 'Requested transcode bitrate, clamped against the user''s cap.' }
        - { name: download, in: query, schema: { type: boolean }, description: Force a direct download (Content-Disposition attachment; never transcodes). }
        - { name: share, in: query, schema: { type: string }, description: Playlist share token (anonymous access). }
      responses:
        '200':
          description: Audio stream (Range honored for direct streams).
          content:
            audio/mpeg: {}
            audio/x-flac: {}
            application/octet-stream: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      operationId: streamSongHeaders
      tags: [playback]
      summary: Stream headers only (wire parity; answered explicitly)
      parameters:
        - $ref: '#/components/parameters/SongId'
        - { name: maxBitRate, in: query, schema: { type: integer } }
        - { name: download, in: query, schema: { type: boolean } }
        - { name: share, in: query, schema: { type: string } }
      responses:
        '200':
          description: Headers the GET would answer (Content-Length for direct streams).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/songs/{id}/scrobble:
    post:
      operationId: scrobbleSong
      tags: [playback]
      summary: Record one play
      description: >
        The body is optional — an absent (or empty) body means "no details".
        `completion` is clamped to [0,100]; `durationListened` to >= 0;
        `playedAt` must parse as a date; `client`/`source` are capped at 255
        characters. Retries double-count — there is no idempotency key.
      parameters:
        - $ref: '#/components/parameters/SongId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrobbleDetails' }
      responses:
        '200':
          description: Play recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/bookmarks:
    get:
      operationId: listBookmarks
      tags: [playback]
      summary: The caller's bookmarks, newest change first
      responses:
        '200':
          description: Bookmarks joined with song display info (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [bookmarks]
                properties:
                  bookmarks:
                    type: array
                    items: { $ref: '#/components/schemas/Bookmark' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/songs/{id}/bookmark:
    put:
      operationId: putBookmark
      tags: [playback]
      summary: Upsert a playback position bookmark
      parameters:
        - $ref: '#/components/parameters/SongId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position]
              properties:
                position: { type: integer, minimum: 0 }
                comment: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Bookmark saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteBookmark
      tags: [playback]
      summary: Remove a bookmark
      parameters:
        - $ref: '#/components/parameters/SongId'
      responses:
        '200':
          description: Bookmark removed (or none existed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/scans:
    post:
      operationId: enqueueScan
      tags: [library]
      summary: Enqueue a library scan (admin)
      responses:
        '200':
          description: Scan enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId]
                properties:
                  ok: { type: boolean, enum: [true] }
                  jobId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/scans/status:
    get:
      operationId: getScanStatus
      tags: [library]
      summary: Most recent scan job (any status), or null
      description: >
        Orders by COALESCE(started_at, created_at) so a queued job is
        reported instead of sinking behind finished ones.
      responses:
        '200':
          description: 'The latest job, or `{"job": null}` when no job exists yet.'
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    anyOf:
                      - { $ref: '#/components/schemas/JobStatus' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/search:
    get:
      operationId: search
      tags: [search]
      summary: Full-text search across songs, albums, artists and playlists
      description: >
        The envelope always carries all four categories; unasked categories
        come back empty. An FTS syntax error degrades to a LIKE prefix query.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free text. }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SearchCategory' }, description: Restrict to one category. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 5 }, description: Per-category cap. }
        - { name: hideExplicit, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Search results envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/statistics/me:
    get:
      operationId: getMyStatistics
      tags: [statistics]
      summary: The caller's listening statistics
      parameters:
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200':
          description: Consolidated statistics for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/statistics/me/monthly-grouped:
    get:
      operationId: getMyMonthlyGroupedStatistics
      tags: [statistics]
      summary: The caller's monthly plays grouped by a dimension
      parameters:
        - $ref: '#/components/parameters/GroupBy'
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200':
          description: Top 6 groups per month plus an "Other" rollup.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MonthlyGroupedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/statistics/overall:
    get:
      operationId: getOverallStatistics
      tags: [statistics]
      summary: Server-wide statistics (admin)
      parameters:
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200':
          description: Consolidated statistics across all users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverallStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/statistics/users/{id}:
    get:
      operationId: getUserStatistics
      tags: [statistics]
      summary: One user's listening statistics (admin)
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200':
          description: Consolidated statistics for the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/statistics/users/{id}/monthly-grouped:
    get:
      operationId: getUserMonthlyGroupedStatistics
      tags: [statistics]
      summary: One user's monthly plays grouped by a dimension (admin)
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GroupBy'
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200':
          description: Top 6 groups per month plus an "Other" rollup.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MonthlyGroupedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/home:
    get:
      operationId: getHome
      tags: [home]
      summary: Landing-page sections in one round trip
      description: >
        `genres` ranks by in-scope active song count (not an alphabetical
        union) and `recentAdditions` is a song list in import
        order (the rowid is the import order; the old server folded additions into album
        cards). `random` is seeded per request; `limit` only caps the random
        section.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: hideExplicit, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: Random-section cap. }
      responses:
        '200':
          description: The five sections, each an array (never null).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/playback/auto-dj:
    get:
      operationId: getAutoDjCandidates
      tags: [auto-dj]
      summary: Auto-DJ candidates (legacy query-string variant)
      parameters:
        - { name: mode, in: query, schema: { $ref: '#/components/schemas/AutoDjMode' } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: currentSongId, in: query, schema: { type: string }, description: Context song (optional for every mode). }
        - { name: excludeIds, in: query, schema: { type: string }, description: Comma-separated song ids to exclude (capped at 500). }
      responses:
        '200':
          description: Candidate songs (empty array when the pool is honestly empty).
          content:
            application/json:
              schema:
                type: object
                required: [songs]
                properties:
                  songs:
                    type: array
                    items: { $ref: '#/components/schemas/AutoDjSong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: Generation failed (the old server answered a silent empty 200).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: generateAutoDjCandidates
      tags: [auto-dj]
      summary: Auto-DJ candidates (body variant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/AutoDjMode' }
                count: { type: integer, minimum: 1, maximum: 50, default: 10 }
                currentSongId: { type: string }
                excludeIds:
                  type: array
                  items: { type: string }
                  description: Over 500 entries is a 400 (the old zod cap).
      responses:
        '200':
          description: Candidate songs (empty array when the pool is honestly empty).
          content:
            application/json:
              schema:
                type: object
                required: [songs]
                properties:
                  songs:
                    type: array
                    items: { $ref: '#/components/schemas/AutoDjSong' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: Generation failed (the old server answered a silent empty 200).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: Live now-playing set (household dashboard, any signed-in user)
      description: >
        One entry per user + device, TTL 5 minutes, refreshed on every stream
        — the server records EVERY stream (native player, API-key clients,
        share-token guests), unlike the old tracker which only saw Subsonic clients.
      responses:
        '200':
          description: Live players (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [players]
                properties:
                  players:
                    type: array
                    items: { $ref: '#/components/schemas/PlayerInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/events:
    get:
      operationId: getEventStream
      tags: [events]
      summary: Server-sent events feed (session cookie only — no API keys)
      security:
        - sessionId: []
      description: >
        `text/event-stream` until disconnect. Emits an initial `connected`
        event (the web client's readiness signal), then `library:changed`
        events for content-changing job completions, with 30-second heartbeat
        comments. Failed jobs broadcast nothing; there is no replay buffer.
        The route is exempt from the global API timeout.
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string, example: "event: connected\ndata: {\"type\":\"connected\"}\n\n" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/upload/sessions:
    post:
      operationId: createUploadSession
      tags: [uploads]
      summary: Create an upload session (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: { type: string, format: uuid }
                duplicateStrategy: { $ref: '#/components/schemas/DuplicateStrategy' }
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/upload/sessions/{id}:
    get:
      operationId: getUploadSession
      tags: [uploads]
      summary: Upload session status (chunks received, reassembled files)
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
      responses:
        '200':
          description: Per-file chunk counts and reassembled files with sizes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/upload/sessions/{id}/complete:
    post:
      operationId: completeUploadSession
      tags: [uploads]
      summary: Complete the session — move files to ingest and enqueue an ingest job
      description: >
        Moves every reassembled file into `<ingestPath>/<libraryId>`, enqueues
        one typed ingest job, then deletes the session row and directory.
        Repeating a completed session answers 404 (the row is gone), which is
        what makes a double-tap idempotent.
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
      responses:
        '200':
          description: Files moved and ingest job enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, moved]
                properties:
                  ok: { type: boolean, enum: [true] }
                  moved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/upload/sessions/{id}/files/{fileId}/complete:
    post:
      operationId: completeUploadedFile
      tags: [uploads]
      summary: Reassemble one file from its chunks
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totalChunks, relativePath]
              properties:
                totalChunks: { type: integer, minimum: 1, maximum: 10000 }
                relativePath: { type: string, description: 'Safe relative path (no absolute paths, no dot segments, forward slashes). The reassembled file lands under its final relative path.' }
      responses:
        '200':
          description: File reassembled.
          content:
            application/json:
              schema:
                type: object
                required: [fileName, size]
                properties:
                  fileName: { type: string }
                  size: { type: integer, format: int64 }
        '400':
          description: Invalid input, or a chunk is missing (message carries the missing index).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Reassembled file exceeds the 1 GiB cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/upload/sessions/{id}/files/{fileId}/chunks/{index}:
    put:
      operationId: uploadChunk
      tags: [uploads]
      summary: Upload one raw-body chunk
      description: >
        The body is the chunk bytes exactly — `application/octet-stream`,
        no multipart framing (a deliberate protocol deviation; the URL
        shape stays compatible with the old client). Re-PUT of the same index overwrites (retry
        idempotency). Chunk cap 10 MiB; index is a 0..9999 integer.
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/ChunkIndex'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Chunk stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Chunk exceeds the 10 MiB cap.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/ingest:
    get:
      operationId: listIngestJobs
      tags: [ingest]
      summary: Last 100 per-file ingest rows
      responses:
        '200':
          description: Newest-first ingest rows (empty array when none).
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/IngestJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: wipeIngestJobs
      tags: [ingest]
      summary: Wipe the ingest history table (admin)
      responses:
        '200':
          description: Table wiped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/ingest/{id}:
    get:
      operationId: getIngestJob
      tags: [ingest]
      summary: One ingest row
      parameters:
        - $ref: '#/components/parameters/IngestJobId'
      responses:
        '200':
          description: The ingest row.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/IngestJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteIngestJob
      tags: [ingest]
      summary: Delete one ingest row (admin)
      parameters:
        - $ref: '#/components/parameters/IngestJobId'
      responses:
        '200':
          description: Row deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/ingest/trigger:
    post:
      operationId: triggerIngest
      tags: [ingest]
      summary: Enqueue an ingest job for a library's drop dir (admin)
      description: >
        The body is optional: an empty/absent body (or `{"libraryId": ""}`)
        targets the default library. The library's drop dir is created if
        missing before the job is enqueued.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                libraryId: { type: string, format: uuid }
      responses:
        '200':
          description: Ingest job enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId]
                properties:
                  ok: { type: boolean, enum: [true] }
                  jobId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/conflicts:
    get:
      operationId: listConflicts
      tags: [ingest]
      summary: Songs parked on " (n)" collision paths (admin)
      responses:
        '200':
          description: Collision candidates with artist/album names.
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items: { $ref: '#/components/schemas/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteConflicts
      tags: [ingest]
      summary: Delete collision files and their song rows (admin)
      description: >
        For every collision song the FILE is deleted first and the row
        second, so a row pointing at a live file never outlives it.
      responses:
        '200':
          description: Number of conflicts deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deleted]
                properties:
                  ok: { type: boolean, enum: [true] }
                  deleted: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/libraries:
    get:
      operationId: listLibrariesForPicker
      tags: [libraries]
      summary: Libraries visible to the caller (picker DTO)
      description: >
        The scope-trimmed list every library picker renders: only
        `id`/`name`/`isDefault`, in the caller's assignment order — never
        host paths or organize patterns. Admins see everything.
      responses:
        '200':
          description: Visible libraries.
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryPicker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/libraries:
    get:
      operationId: listLibrariesAdmin
      tags: [libraries]
      summary: List all libraries (admin)
      responses:
        '200':
          description: Every library, full DTO.
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createLibrary
      tags: [libraries]
      summary: Create a library (admin)
      description: >
        The first library ever created becomes the default; `isDefault: true`
        clears the flag on every other library in the same transaction. An
        omitted pattern falls back to the global `organize_pattern` setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, path]
              properties:
                name: { type: string, minLength: 1 }
                path: { type: string, minLength: 1 }
                organizePattern: { type: string, minLength: 1 }
                isDefault: { type: boolean }
      responses:
        '201':
          description: Library created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Library path already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/admin/libraries/{id}:
    put:
      operationId: updateLibrary
      tags: [libraries]
      summary: Update a library (admin)
      description: >
        Partial update; absent fields keep their values. A resulting
        `isDefault: true` clears the flag on every other library in the same
        transaction.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                path: { type: string, minLength: 1 }
                organizePattern: { type: string, minLength: 1 }
                isDefault: { type: boolean }
      responses:
        '200':
          description: Library updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Library path already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteLibrary
      tags: [libraries]
      summary: Delete a library (admin)
      description: >
        When the deleted library was the default, the first remaining
        library (by name) is promoted — in the same transaction, so the
        one-default invariant cannot be observed half-applied.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: Library deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/libraries/{id}/users:
    get:
      operationId: listLibraryUsers
      tags: [libraries]
      summary: Users assigned to a library (admin)
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: Assigned user ids.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: assignUsersToLibrary
      tags: [libraries]
      summary: Assign users to a library (admin)
      description: Additive — duplicates are ignored (INSERT OR IGNORE).
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Assignments added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/libraries/{id}/users/{userId}:
    delete:
      operationId: removeUserFromLibrary
      tags: [libraries]
      summary: Remove one user assignment (admin)
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Assignment removed (or never existed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/libraries:
    get:
      operationId: listUserLibraries
      tags: [libraries]
      summary: Libraries assigned to a user (admin)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Assigned library ids.
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: assignLibrariesToUser
      tags: [libraries]
      summary: Assign libraries to a user (admin)
      description: Additive — duplicates are ignored (INSERT OR IGNORE).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryIds]
              properties:
                libraryIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Assignments added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/users/{id}/libraries/{libraryId}:
    delete:
      operationId: removeLibraryFromUser
      tags: [libraries]
      summary: Remove one library assignment (admin)
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/LibraryIdPath'
      responses:
        '200':
          description: Assignment removed (or never existed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/songs/{id}/tags:
    put:
      operationId: updateSongTags
      tags: [tags]
      summary: Edit a song's tags (admin)
      description: >
        Writes the tags into the file through the mutagen-backed tag writer
        (atomic temp-sibling rewrite), re-organizes the file when the new
        tags change the pattern target, refreshes the database through the
        one persist path, and queues a coalesced resync. Reports entities
        (artist/album) orphaned by the rename.
      parameters:
        - $ref: '#/components/parameters/SongId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SongTags' }
      responses:
        '200':
          description: Tags applied.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
                  orphanedEntities:
                    type: array
                    items: { $ref: '#/components/schemas/OrphanedEntity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/songs/tags:
    put:
      operationId: updateSongsTags
      tags: [tags]
      summary: Apply one tag edit to many songs (admin)
      description: >
        The same edit applied sequentially; the first failing song stops the
        run and its id comes back in `failedId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, tags]
              properties:
                ids:
                  type: array
                  items: { type: string }
                tags: { $ref: '#/components/schemas/SongTags' }
      responses:
        '200':
          description: Tags applied to every id.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
                  orphanedEntities:
                    type: array
                    items: { $ref: '#/components/schemas/OrphanedEntity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: A song id did not resolve.
          content:
            application/json:
              schema:
                type: object
                required: [error, failedId]
                properties:
                  error: { type: string }
                  failedId: { type: string }
  /api/albums/{id}/tags:
    put:
      operationId: updateAlbumTags
      tags: [tags]
      summary: Edit an album's tags across its songs (admin)
      description: >
        `releaseType` is album-level metadata (not a file tag) and is pulled
        out before validation. The per-song file writes exclude `genre`
        (album-level genres live on the album junctions). Album-wide edits
        queue ONE coalesced resync for the whole run.
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/SongTags' }
                - type: object
                  properties:
                    releaseType: { type: string }
      responses:
        '200':
          description: Number of songs updated.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/songs/{id}/cover-art:
    post:
      operationId: uploadSongCoverArt
      tags: [tags]
      summary: Upload a song's cover art (admin)
      description: >
        Raw body, at most 2 MiB, magic-byte sniffed (jpeg/png/webp — a
        declared mimetype is NOT trusted). The blob is stored hash-dedup and
        linked on the song row; the previously linked blob is removed when
        nothing references it. Unlike the old behavior the art is NOT embedded into the
        audio file (read-only doctrine — all readers consult the link).
      parameters:
        - $ref: '#/components/parameters/SongId'
      requestBody:
        required: true
        content:
          image/jpeg: {}
          image/png: {}
          image/webp: {}
      responses:
        '200':
          description: The stored cover art id.
          content:
            application/json:
              schema:
                type: object
                required: [coverArt]
                properties:
                  coverArt: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSongCoverArt
      tags: [tags]
      summary: Unlink a song's cover art (admin)
      parameters:
        - $ref: '#/components/parameters/SongId'
      responses:
        '200':
          description: Cover unlinked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/albums/{id}/cover-art:
    post:
      operationId: uploadAlbumCoverArt
      tags: [tags]
      summary: Upload an album's cover art (admin)
      description: >
        Same sniffed, hash-dedup blob storage as the song variant, linked on
        the album row. Unlike the old behavior the art is NOT embedded into every song
        file (read-only doctrine).
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          image/jpeg: {}
          image/png: {}
          image/webp: {}
      responses:
        '200':
          description: The stored cover art id.
          content:
            application/json:
              schema:
                type: object
                required: [coverArt]
                properties:
                  coverArt: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAlbumCoverArt
      tags: [tags]
      summary: Unlink an album's cover art (admin)
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      responses:
        '200':
          description: Cover unlinked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/suggestions:
    get:
      operationId: getSuggestions
      tags: [catalog]
      summary: Field-whitelist autocomplete (admin)
      description: >
        Case-insensitive contains-match over the whitelisted fields
        (`artist`, `album`, `albumArtist`, `releaseType`, `genre` full
        paths). `limit` clamps to 1–50 and defaults to 20. `releaseType`
        merges the canonical seeds with stored values.
      parameters:
        - name: field
          in: query
          required: true
          schema:
            type: string
            enum: [artist, album, genre, albumArtist, releaseType]
        - name: q
          in: query
          schema: { type: string, default: '' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Suggestion strings.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/musicbrainz/search:
    get:
      operationId: searchMusicBrainz
      tags: [providers]
      summary: Proxy a MusicBrainz search (admin)
      description: >
        `mbid` performs an exact entity lookup (a miss falls through to the
        query search). Requests are spaced process-wide by at least 1.2s
        (MusicBrainz etiquette), bounded by a 10s timeout, and never cached.
        Failures answer a generic 502 — upstream details stay server-side.
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [song, album, artist]
        - name: title
          in: query
          schema: { type: string }
        - name: artist
          in: query
          schema: { type: string }
        - name: album
          in: query
          schema: { type: string }
        - name: mbid
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Search matches.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: '#/components/schemas/MusicBrainzMatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: MusicBrainz unreachable or erroring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/lrclib/search:
    get:
      operationId: searchLrcLib
      tags: [providers]
      summary: Proxy a LRCLIB lyrics search (admin)
      description: >
        10s timeout, one retry with backoff on 429/503, never cached.
        Failures answer a generic 502 — upstream details stay server-side.
      parameters:
        - name: title
          in: query
          required: true
          schema: { type: string }
        - name: artist
          in: query
          schema: { type: string }
        - name: album
          in: query
          schema: { type: string }
        - name: duration
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Lyric matches.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: '#/components/schemas/LrcLibMatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: LRCLIB unreachable or erroring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/artist-images/{id}:
    get:
      operationId: getArtistImage
      tags: [catalog]
      summary: Artist image file
      security: []
      description: >
        Serves the artist's locally synced image (the recorded path, or a
        DATA_DIR/artist-images/<id>.* leftover) when one exists; 404
        otherwise. Publicly readable — the file renders in <img> tags.
      parameters:
        - $ref: '#/components/parameters/ArtistId'
      responses:
        '200':
          description: The image bytes (Content-Type by extension).
          content:
            image/jpeg: {}
            image/png: {}
            image/gif: {}
            image/webp: {}
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/artists/refetch:
    post:
      operationId: refetchArtistImages
      tags: [catalog]
      summary: Enqueue an artist image re-sync (admin)
      description: >
        Enqueues an artist_images job with `refetchExisting` set, so every
        active artist is re-fetched (the periodic sync only covers artists
        missing a local image).
      responses:
        '202':
          description: Job enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId]
                properties:
                  ok: { type: boolean, enum: [true] }
                  jobId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/me/avatar:
    post:
      operationId: uploadAvatar
      tags: [auth]
      summary: Upload the caller's avatar
      description: >
        Raw body, at most 2 MiB, magic-byte sniffed (jpeg/png/webp/gif).
        Stored under the server data dir and recorded on the user row; the
        previous file with a different extension is removed. Answers the
        refreshed public user.
      responses:
        '200':
          description: Avatar stored.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/system-tasks:
    get:
      operationId: listSystemTasks
      tags: [admin]
      summary: Periodic system tasks and their state (admin)
      responses:
        '200':
          description: Task definitions with the latest job status.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
