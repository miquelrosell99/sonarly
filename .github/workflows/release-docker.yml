# Release Docker image.
#
# Triggered by a pushed v* tag (a real release) or manual dispatch.
# Dispatch takes an optional git-ref (default main) to build the checkout
# from; a dispatch whose git-ref NAMES a tag (v* / refs/tags/v*) fails
# loudly, because a pushed tag is what triggers a real release — a dispatch
# runs with ref_type 'branch', cannot publish, and building a tag-named ref
# by hand almost certainly means the operator forgot to push the tag.
# Branch dispatches are allowed but the publish gate skips them (this
# workflow only publishes images).
name: Release Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Ref to check out (branch or SHA); a tag name fails loudly'
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-published release

jobs:
  # Fail-loud guard: the docker job's tag gate silently SKIPS non-tag refs,
  # so the guard lives in its own always-runs job (its step is conditional).
  guard:
    runs-on: ubuntu-22.04
    steps:
      - name: Fail loudly on a dispatch whose git-ref names a tag
        if: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.git-ref, 'v') || startsWith(inputs.git-ref, 'refs/tags/v')) }}
        run: |
          echo "::error::A pushed tag is what triggers a real release. A workflow_dispatch runs with ref_type 'branch' and cannot publish, so building a tag-named ref by dispatch almost certainly means you forgot to push the tag. Push the v* tag and let the tag push run this workflow."
          exit 1

  docker:
    runs-on: ubuntu-22.04
    if: ${{ github.ref_type == 'tag' }}   # publish jobs NEVER run from non-tag refs
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git-ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest = latest STABLE semver tag only — prereleases must not clobber it
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONARLY_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=sonarly
          cache-to: type=gha,mode=max,scope=sonarly
