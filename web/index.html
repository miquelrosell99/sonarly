<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F7F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sonarly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-hydration theme bootstrap. Must agree with readPersistedTheme in
      // web/src/stores/themeStore.ts: same key, same accepted values, same
      // defaults, so the first paint matches what the store applies at
      // hydration (no accent/mode flip).
      (function () {
        var mode = 'auto';
        var accent = 'monochrome';
        try {
          var stored = window.localStorage.getItem('sonarly-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'oled') {
            mode = stored; // legacy bare-mode string
          } else if (stored) {
            try {
              var parsed = JSON.parse(stored);
              if (parsed && typeof parsed === 'object') {
                if (parsed.mode === 'auto' || parsed.mode === 'light' || parsed.mode === 'dark' || parsed.mode === 'oled') {
                  mode = parsed.mode;
                }
                if (
                  ['monochrome', 'brown', 'green', 'orange', 'teal', 'purple', 'yellow', 'cyan', 'blue'].indexOf(
                    parsed.accent,
                  ) !== -1
                ) {
                  accent = parsed.accent;
                }
              }
            } catch (e) {}
          }
        } catch (e) {}
        var resolved =
          mode === 'auto'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
        document.documentElement.classList.add('theme-' + resolved, 'accent-' + accent);
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
