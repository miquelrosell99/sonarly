# Nightly Docker image.
#
# Scheduled build of the repository default branch's head (main) plus manual
# dispatch. Dispatch takes an optional git-ref (default main); a nightly MUST
# be the default branch's head — a dispatch naming any other ref fails loudly,
# because publishing an image built from another ref would mislabel it as
# the nightly channel.
name: Nightly Docker image

on:
  schedule:
    # nightly build of main's head, off the :00 mark
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Ref to check out — must be the default branch (main)'
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-docker
  cancel-in-progress: false   # a cancelled nightly leaves no channel update

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Fail loudly on a dispatch of a non-default-branch ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.git-ref != 'main' }}
        run: |
          echo "::error::The nightly image must be built from the repository default branch's head (main) — publishing an image built from another ref would mislabel it as the nightly channel. Leave git-ref at main (or cut a proper release via a pushed v* tag)."
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git-ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONARLY_VERSION=nightly-${{ github.sha }}
          cache-from: type=gha,scope=sonarly
          cache-to: type=gha,mode=max,scope=sonarly
