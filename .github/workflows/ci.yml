name: CI

on:
  pull_request:
    branches:
      - main
  schedule:
    # nightly main-head cover, off the :00 mark — no per-push CI on main
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: Design-token drift check
        working-directory: web
        run: node scripts/token-drift.mjs

      - name: Verify generated contract schema is up to date
        working-directory: web
        run: |
          node scripts/contract-gen.mjs /tmp/sonarly-contract-schema.ts
          diff -u src/contract/schema.ts /tmp/sonarly-contract-schema.ts
