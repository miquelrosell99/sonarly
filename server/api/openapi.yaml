      operationId: organize
      tags: [ingest]
      summary: Enqueue an organize job (admin, 202)
      description: >
        Re-applies every library's organize pattern to the files already in
        the library. The job runs on the worker — never inline on the
        request goroutine.
      responses:
        '202':
          description: Job enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/organize/job:
    post:
      operationId: organizeJob
      tags: [ingest]
      summary: Enqueue an organize job (admin, 200 — legacy response shape)
      responses:
        '200':
          description: Job enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/organize/preview:
    get:
      operationId: organizePreview
      tags: [ingest]
      summary: The effective organize pattern
      security: []
      description: >
        Unauthenticated, exactly as before — the route only answers the
        configured pattern.
      responses:
        '200':
          description: The effective pattern.
          content:
            application/json:
              schema:
                type: object
                required: [pattern]
                properties:
                  pattern: { type: string }
  /api/organize/status/{jobId}:
    get:
      operationId: organizeStatus
      tags: [ingest]
      summary: One organize job's status (admin)
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job status document.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/OrganizeJobStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionId:
      type: apiKey
      in: cookie
      name: sessionId
      description: Signed session cookie (HttpOnly, SameSite=Strict), set by /api/login and /api/setup. The only credential /api/events accepts.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternative to the session cookie on ordinary /api routes (not /api/events). SHA-256 digest looked up in api_keys.
  parameters:
    SongId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Song id (UUID).
    AlbumId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Album id (UUID).
    ArtistId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Artist id (UUID).
    GenreId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Genre id (UUID).
    CoverArtId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Cover art id.
    PlaylistId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Playlist id (UUID).
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: User id (UUID).
    ShareUserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: The share recipient's user id (UUID).
    IngestJobId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Ingest job id (UUID).
    UploadSessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Upload session id (server-minted UUID).
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
      description: Client-chosen file id (alphanumeric, dash, underscore).
    ChunkIndex:
      name: index
      in: path
      required: true
      schema: { type: integer, minimum: 0, maximum: 9999 }
      description: Chunk index within the file.
    TimeRange:
      name: range
      in: query
      schema: { $ref: '#/components/schemas/TimeRange' }
      description: Statistics window; an unrecognized value falls back to `all` rather than failing.
    GroupBy:
      name: groupBy
      in: query
      required: true
      schema: { $ref: '#/components/schemas/GroupBy' }
    LibraryId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Library id (UUID).
    LibraryIdPath:
      name: libraryId
      in: path
      required: true
      schema: { type: string }
      description: Library id (UUID).
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: User id (UUID).
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        enum: [periodic_scan, review_cleanup, artist_images, ingest]
      description: System task id.
    RunId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Ingest run id (the scan_jobs row id).
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
      description: Scan job id (UUID).
  responses:
    BadRequest:
      description: Malformed input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed (admin-gated route, or playlist access denied).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (or out of the caller's scope).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    # --- enums ---------------------------------------------------------------
    TranscodeFormat:
      type: string
      enum: [mp3, aac, opus]
    PlaylistVisibility:
      type: string
      enum: [private, shared, public, link]
    ResolveMode:
      type: string
      enum: [tracks, query]
      description: >
        `tracks` resolves a smart playlist's user-scoped rule fields against
        the owner's data so every viewer receives the same curated list;
        `query` re-resolves live against each viewer's own data.
    DuplicateStrategy:
      type: string
      enum:
        - replace_file_and_metadata
        - keep_file_replace_metadata
        - replace_file_aggregate_metadata
        - keep_file_aggregate_metadata
        - skip
    TimeRange:
      type: string
      enum: ['7d', '30d', '90d', '1y', all]
    GroupBy:
      type: string
      enum: [artist, genre, year, rating, favorite]
    SearchCategory:
      type: string
      enum: [songs, albums, artists, playlists]
    AutoDjMode:
      type: string
      enum: [similar, random, smart]
    AutoDjExcludeWindow:
      type: string
      enum: ['24h', '7d', '30d']
    JobType:
      type: string
      enum: [scan, resync, ingest, organize, cleanup_review, artist_images]
    JobStatusName:
      type: string
      enum: [pending, running, completed, failed]
    # --- libraries -------------------------------------------------------------
    Library:
      type: object
      required: [id, name, path, organizePattern, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string, description: 'Host filesystem path — admin surface only, never in the picker DTO.' }
        organizePattern: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    LibraryPicker:
      type: object
      required: [id, name, isDefault]
      properties:
        id: { type: string }
        name: { type: string }
        isDefault: { type: boolean }
    # --- tag editing -------------------------------------------------------------
    SongTags:
      type: object
      description: >
        The tag-edit allowlist — any other key is rejected with 400.
        Absent fields leave the file and database untouched. String fields
        `artist`/`albumArtist`/`genre` also accept an array of strings.
      properties:
        title: { type: string }
        artist:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        album: { type: string }
        albumArtist:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        genre:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        year: { type: integer }
        explicit: { type: boolean }
        lyrics: { type: string }
    OrphanedEntity:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [artist, album] }
        id: { type: string }
        name: { type: string }
    # --- providers ---------------------------------------------------------------
    MusicBrainzMatch:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        albumArtist: { type: string }
        albumArtists: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        year: { type: integer }
        coverArt: { type: string, description: 'Cover Art Archive front URL.' }
        disambiguation: { type: string }
    LrcLibMatch:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }
        artistName: { type: string }
        albumName: { type: string }
        duration: { type: number }
        instrumental: { type: boolean }
        lyrics: { type: string }
        syncedLyrics:
          type: array
          items: { $ref: '#/components/schemas/SyncedLyricLine' }
    # --- admin dashboard ---------------------------------------------------------
    SystemTask:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string, enum: [periodic_scan, review_cleanup, artist_images, ingest] }
        name: { type: string }
        description: { type: string }
        intervalMinutes: { type: integer, nullable: true, description: 'null when the trigger is disabled.' }
        lastRunAt: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/JobStatusName' }
    SystemTaskHistoryEntry:
      type: object
      required: [id, task, type, status]
      properties:
        id: { type: string }
        task: { type: string, description: 'Display name (taskNameByType).' }
        type: { $ref: '#/components/schemas/JobType' }
        status: { $ref: '#/components/schemas/JobStatusName' }
        startedAt: { type: string, nullable: true }
        finishedAt: { type: string, nullable: true }
        stats: { type: object, additionalProperties: true }
    SystemTaskHistoryPage:
      type: object
      required: [history, page, limit, total, totalPages]
      properties:
        history:
          type: array
          items: { $ref: '#/components/schemas/SystemTaskHistoryEntry' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    AdminStatus:
      type: object
      required: [counts, conflictsCount, missingCounts, ingestJobsCount, latestIngest]
      properties:
        counts:
          type: object
          required: [users, songs, albums, artists]
          properties:
            users: { type: integer }
            songs: { type: integer }
            albums: { type: integer }
            artists: { type: integer }
        conflictsCount: { type: integer }
        missingCounts:
          type: object
          required: [songs, albums, artists]
          properties:
            songs: { type: integer }
            albums: { type: integer }
            artists: { type: integer }
        ingestJobsCount: { type: integer }
        latestIngest: { $ref: '#/components/schemas/IngestRun' }
    MissingSong:
      type: object
      required: [id, filePath, title]
      properties:
        id: { type: string }
        filePath: { type: string }
        title: { type: string }
        artistName: { type: string }
        albumName: { type: string }
        year: { type: integer }
        genre: { type: string }
    MissingAlbum:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        artistName: { type: string }
        year: { type: integer }
        genre: { type: string }
    MissingArtist:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    IngestRun:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/JobStatusName' }
        startedAt: { type: string, nullable: true }
        finishedAt: { type: string, nullable: true }
        stats: { type: object, additionalProperties: true }
        error: { type: string }
    IngestRunDetail:
      allOf:
        - { $ref: '#/components/schemas/IngestRun' }
        - type: object
          required: [jobs]
          properties:
            jobs:
              type: array
              items: { $ref: '#/components/schemas/IngestJob' }
    MediaSettings:
      type: object
      required: [organizePattern, duplicateStrategy, reviewRetentionDays, templates]
      properties:
        organizePattern: { type: string }
        duplicateStrategy: { $ref: '#/components/schemas/DuplicateStrategy' }
        reviewRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        templates:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
    MediaSettingsWithoutTemplates:
      type: object
      required: [organizePattern, duplicateStrategy, reviewRetentionDays]
      properties:
        organizePattern: { type: string }
        duplicateStrategy: { $ref: '#/components/schemas/DuplicateStrategy' }
        reviewRetentionDays: { type: integer, minimum: 1, maximum: 365 }
    OrganizeJobStatus:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string }
        type: { type: string, enum: [organize] }
        status: { $ref: '#/components/schemas/JobStatusName' }
        startedAt: { type: string }
        finishedAt: { type: string }
        stats: { type: object, additionalProperties: true }
    # --- users ---------------------------------------------------------------
    PublicUser:
      type: object
      required: [id, username, isAdmin, createdAt, hideExplicit, blurExplicitTitles, blurExplicitCovers]
      properties:
        id: { type: string }
        username: { type: string }
        isAdmin: { type: boolean }
        createdAt: { type: string, description: 'UTC ISO 8601 timestamp with milliseconds.' }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, description: '`/api/avatars/{id}` when the user has an avatar.' }
        maxBitrateKbps: { type: integer, minimum: 64, maximum: 320 }
        transcodeFormat: { $ref: '#/components/schemas/TranscodeFormat' }
        hideExplicit: { type: boolean }
        blurExplicitTitles: { type: boolean }
        blurExplicitCovers: { type: boolean }
    Preferences:
      type: object
      description: >
        The user preferences document: shared defaults under stored
        overrides. Keys outside this list can exist in the stored blob
        (legacy clients) and are returned as-is, but PATCH only accepts the
        allowlisted set.
      properties:
        autoDjEnabled: { type: boolean }
        autoDjMode: { $ref: '#/components/schemas/AutoDjMode' }
        autoDjTopUpThreshold: { type: number, minimum: 1, maximum: 20 }
        autoDjBatchSize: { type: number, minimum: 1, maximum: 50 }
        autoDjExcludeWindow: { $ref: '#/components/schemas/AutoDjExcludeWindow' }
        autoDjPreferFavorites: { type: boolean }
        autoDjDiscovery: { type: number, minimum: 0, maximum: 100 }
        hideSponsorButton: { type: boolean }
        themeMode: { type: string, enum: [light, dark, oled, auto] }
        accentColor:
          type: string
          enum: [auto, monochrome, brown, green, orange, teal, purple, yellow, cyan, blue]
        playlistsCollapsed: { type: boolean }
        sidebar: { type: object }
        theme: { type: object }
        sidebarConfig: { type: object }
        viewOptions: { type: object }
      additionalProperties: true
    PreferencesPatch:
      type: object
      description: >
        PATCH body for /api/me/preferences: every present key must be in the
        allowlist (the Preferences properties above); unknown keys are
        rejected with 400. Out-of-range numbers clamp into range.
      properties:
        autoDjEnabled: { type: boolean }
        autoDjMode: { $ref: '#/components/schemas/AutoDjMode' }
        autoDjTopUpThreshold: { type: number, minimum: 1, maximum: 20 }
        autoDjBatchSize: { type: number, minimum: 1, maximum: 50 }
        autoDjExcludeWindow: { $ref: '#/components/schemas/AutoDjExcludeWindow' }
        autoDjPreferFavorites: { type: boolean }
        autoDjDiscovery: { type: number, minimum: 0, maximum: 100 }
        hideSponsorButton: { type: boolean }
        themeMode: { type: string, enum: [light, dark, oled, auto] }
        accentColor:
          type: string
          enum: [auto, monochrome, brown, green, orange, teal, purple, yellow, cyan, blue]
        playlistsCollapsed: { type: boolean }
        sidebar: { type: object }
        theme: { type: object }
        sidebarConfig: { type: object }
        viewOptions: { type: object }
      additionalProperties: false
    AdminUpdateInput:
      type: object
      description: >
        All properties optional. `name`, `surname`, `email`,
        `maxBitrateKbps`, `transcodeFormat`, `hideExplicit`,
        `blurExplicitTitles` and `blurExplicitCovers` accept explicit `null`
        to clear the stored value; `isAdmin` and `password` treat null like
        absent (untouched).
      properties:
        isAdmin: { type: [boolean, 'null'] }
        name: { type: [string, 'null'] }
        surname: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        password: { type: [string, 'null'], format: password, minLength: 8 }
        maxBitrateKbps: { type: [integer, 'null'], minimum: 64, maximum: 320 }
        transcodeFormat:
          anyOf:
            - { $ref: '#/components/schemas/TranscodeFormat' }
            - { type: 'null' }
        hideExplicit: { type: [boolean, 'null'] }
        blurExplicitTitles: { type: [boolean, 'null'] }
        blurExplicitCovers: { type: [boolean, 'null'] }
    # --- catalog -------------------------------------------------------------
    Entry:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SyncedLyricLine:
      type: object
      required: [time, text]
      properties:
        time: { type: number }
        text: { type: string }
    Song:
      type: object
      description: The API-facing song shape (no filePath/checksum anywhere in the API).
      required:
        - id
        - title
        - explicit
        - coverArtMissing
        - mtime
        - active
        - gapless
        - starred
      properties:
        id: { type: string }
        title: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        duration: { type: integer, description: Seconds. }
        artistId: { type: string }
        albumId: { type: string }
        genre: { type: string }
        genreId: { type: string }
        libraryId: { type: string }
        year: { type: integer }
        explicit: { type: boolean }
        coverArt: { type: string }
        albumCoverArt: { type: string }
        coverArtMissing: { type: boolean }
        mtime: { type: integer, format: int64 }
        active: { type: boolean }
        bitRate: { type: integer }
        bitsPerSample: { type: integer }
        sampleRate: { type: integer }
        channels: { type: integer }
        bpm: { type: integer }
        musicBrainzId: { type: string }
        musicBrainzTrackId: { type: string }
        musicBrainzWorkId: { type: string }
        musicBrainzDiscId: { type: string }
        replayGain: { type: number }
        averageRating: { type: number }
        comment: { type: string }
        sortName: { type: string }
        mood: { type: string }
        mediaType: { type: string }
        originalReleaseDate: { type: string }
        releaseDate: { type: string }
        remixOf: { type: string }
        displayArtist: { type: string }
        displayAlbumArtist: { type: string }
        lyrics: { type: string }
        syncedLyrics:
          description: Parsed LRC payload; usually SyncedLyricLine[], but any JSON stored in the column passes through.
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/SyncedLyricLine' }
            - type: string
        producers:
          type: array
          items: { type: string }
        isrcs:
          type: array
          items: { type: string }
        originalYear: { type: integer }
        originalArtist: { type: string }
        gapless: { type: boolean }
        totalTracks: { type: string }
        totalDiscs: { type: string }
        artistName: { type: string }
        albumName: { type: string }
        albumArtistName: { type: string }
        artists:
          type: array
          items: { type: string }
        artistEntries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        composerEntries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        genres:
          type: array
          items: { type: string }
        starred: { type: boolean }
        rating: { type: number }
    Album:
      type: object
      description: >
        `totalSongCount` counts every in-scope active song; `shownSongCount`
        excludes explicit songs when the caller asked to hide them;
        `explicit` mirrors the old behavior (any in-scope active song is explicit).
      required: [id, name, active, totalSongCount, shownSongCount, explicit, starred]
      properties:
        id: { type: string }
        name: { type: string }
        artistId: { type: string }
        artistName: { type: string }
        releaseType: { type: string }
        year: { type: integer }
        genre: { type: string }
        coverArt: { type: string }
        active: { type: boolean }
        catalogNumbers:
          type: array
          items: { type: string }
        barcode: { type: string }
        asin: { type: string }
        musicBrainzAlbumId: { type: string }
        musicBrainzReleaseGroupId: { type: string }
        musicBrainzAlbumArtistIds:
          type: array
          items: { type: string }
        originalYear: { type: integer }
        compilation: { type: boolean }
        totalTracks: { type: string }
        totalDiscs: { type: string }
        totalSongCount: { type: integer }
        shownSongCount: { type: integer }
        explicit: { type: boolean }
        artists:
          type: array
          items: { type: string }
        genres:
          type: array
          items: { type: string }
        labelEntries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        starred: { type: boolean }
        rating: { type: number }
    ArtistAlbum:
      type: object
      description: Trimmed album card embedded in the artist detail response.
      required: [id, name, totalSongCount, shownSongCount, starred]
      properties:
        id: { type: string }
        name: { type: string }
        year: { type: integer }
        genre: { type: string }
        coverArt: { type: string }
        totalSongCount: { type: integer }
        shownSongCount: { type: integer }
        starred: { type: boolean }
        rating: { type: number }
    Artist:
      type: object
      description: '`albums` is populated on the detail endpoint only.'
      required: [id, name, active, starred]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        musicBrainzArtistIds:
          type: array
          items: { type: string }
        bio: { type: string }
        externalUrls: { description: 'Stored artist links (string map).', type: object, additionalProperties: { type: string } }
        artistImageUrl: { type: string }
        albums:
          type: array
          items: { $ref: '#/components/schemas/ArtistAlbum' }
        starred: { type: boolean }
        rating: { type: number }
    Genre:
      type: object
      description: Flat genre list entry with its resolved `Parent > Child` path.
      required: [id, name, path, active]
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string }
        path: { type: string }
        active: { type: boolean }
    GenreNode:
      type: object
      description: 'Genre tree node; `children` is always present (possibly empty).'
      required: [id, name, path, active, children]
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string }
        path: { type: string }
        active: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/GenreNode' }
    YearCount:
      type: object
      required: [year, songCount]
      properties:
        year: { type: integer }
        songCount: { type: integer }
    CoverAlbum:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        coverArt: { type: string }
    # --- playlists -----------------------------------------------------------
    NameEntry:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PlaylistListItem:
      type: object
      description: >
        One entry of GET /api/playlists. `shareToken` is populated only for
        the playlist's owner (other viewers never see it).
      required: [id, name, ownerId, ownerUsername, visibility, isSmart, resolveMode, songCount, starred, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string }
        ownerUsername: { type: string }
        visibility: { $ref: '#/components/schemas/PlaylistVisibility' }
        shareToken: { type: string }
        isSmart: { type: boolean }
        resolveMode: { $ref: '#/components/schemas/ResolveMode' }
        rules:
          anyOf:
            - { $ref: '#/components/schemas/SmartPlaylistRules' }
            - { type: 'null' }
        songCount: { type: integer }
        starred: { type: boolean }
        rating: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }
    PlaylistEntry:
      type: object
      description: >
        One song inside a playlist detail. `track`, `discNumber` and
        `duration` are always present but null when unknown; `album` and
        `artist` are the display names (empty string when unset), matching
        the old fetchPlaylistSongs shape.
      required: [id, title, album, artist, explicit, track, discNumber, duration, type, isDir, created]
      properties:
        id: { type: string }
        title: { type: string }
        album: { type: string }
        albumId: { type: string }
        artist: { type: string }
        artistId: { type: string }
        artists:
          type: array
          items: { type: string }
        artistEntries:
          type: array
          items: { $ref: '#/components/schemas/NameEntry' }
        track: { type: [integer, 'null'] }
        discNumber: { type: [integer, 'null'] }
        genre: { type: string }
        year: { type: integer }
        explicit: { type: boolean }
        duration: { type: [integer, 'null'], description: Seconds. }
        coverArt: { type: string }
        albumCoverArt: { type: string }
        type: { type: string }
        isDir: { type: boolean }
        created: { type: string }
    ShareEntry:
      type: object
      required: [userId, username, canEdit]
      properties:
        userId: { type: string }
        username: { type: string }
        canEdit: { type: boolean }
    PlaylistDetail:
      type: object
      description: '`shares` and `shareToken` are owner-only.'
      required: [id, name, ownerId, ownerUsername, visibility, isSmart, resolveMode, songCount, entries, starred, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string }
        ownerUsername: { type: string }
        visibility: { $ref: '#/components/schemas/PlaylistVisibility' }
        shareToken: { type: string }
        isSmart: { type: boolean }
        resolveMode: { $ref: '#/components/schemas/ResolveMode' }
        songCount: { type: integer }
        entries:
          type: array
          items: { $ref: '#/components/schemas/PlaylistEntry' }
        shares:
          type: array
          items: { $ref: '#/components/schemas/ShareEntry' }
        starred: { type: boolean }
        rating: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }
    SmartPlaylistRules:
      type: object
      description: >
        Smart playlist rules (single-level groups, no nesting).
        A song matches when every `all` rule matches AND at least one `any`
        rule matches; a missing group side is not constrained.
        Field/operator whitelists are enforced by the rules compiler (see
        docs/smart-playlists.md), not by this schema.
      properties:
        rules:
          type: object
          properties:
            all:
              type: array
              items: { $ref: '#/components/schemas/SmartPlaylistRule' }
            any:
              type: array
              items: { $ref: '#/components/schemas/SmartPlaylistRule' }
        sort:
          type: array
          items: { $ref: '#/components/schemas/SmartPlaylistSort' }
        limit: { type: integer }
        limitPercent: { type: integer }
    SmartPlaylistRule:
      type: object
      required: [field, operator]
      properties:
        field: { type: string }
        operator: { type: string }
        value:
          description: 'String, number, boolean, or a two-element number array (inTheRange).'
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items: { type: number }
    SmartPlaylistSort:
      type: object
      description: 'Either `{field, direction}` or `{random: true}` — never both.'
      properties:
        field: { type: string }
        direction: { type: string, enum: [asc, desc] }
        random: { type: boolean }
    # --- playback ------------------------------------------------------------
    ScrobbleDetails:
      type: object
      description: Optional scrobble detail fields; absent fields are simply not stored.
      properties:
        durationListened: { type: number, minimum: 0 }
        completion: { type: number, minimum: 0, maximum: 100 }
        client: { type: string, maxLength: 255 }
        source: { type: string, maxLength: 255 }
        playedAt: { type: string, description: 'Date string in any format Go/JavaScript Date.parse accepts; stored verbatim.' }
    BookmarkSong:
      type: object
      required: [id, title, duration]
      properties:
        id: { type: string }
        title: { type: string }
        duration: { type: integer, description: 'Seconds; 0 when unknown.' }
        artistName: { type: string }
        albumName: { type: string }
    Bookmark:
      type: object
      required: [songId, position, comment, createdAt, updatedAt, song]
      properties:
        songId: { type: string }
        position: { type: integer }
        comment: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }
        song: { $ref: '#/components/schemas/BookmarkSong' }
    # --- library jobs --------------------------------------------------------
    JobStatus:
      type: object
      description: Public shape of a scan_jobs row; timestamps keep the raw SQLite `datetime('now')` strings.
      required: [id, type, status, stats]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/JobType' }
        status: { $ref: '#/components/schemas/JobStatusName' }
        createdAt: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
        stats:
          description: The job's raw progress/stats document (arbitrary JSON), or null.
          type: [object, 'null']
          additionalProperties: true
        error: { type: string }
    # --- search --------------------------------------------------------------
    SearchSong:
      type: object
      description: Display subset of the catalog song DTO plus joined display names.
      required: [id, title, explicit, mtime, active, starred]
      properties:
        id: { type: string }
        title: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        duration: { type: integer }
        artistId: { type: string }
        albumId: { type: string }
        artistName: { type: string }
        albumName: { type: string }
        genre: { type: string }
        genreId: { type: string }
        year: { type: integer }
        explicit: { type: boolean }
        coverArt: { type: string }
        mtime: { type: integer, format: int64 }
        active: { type: boolean }
        artists:
          type: array
          items: { type: string }
        genres:
          type: array
          items: { type: string }
        starred: { type: boolean }
        rating: { type: number }
    SearchAlbum:
      type: object
      required: [id, name, active, starred, explicit]
      properties:
        id: { type: string }
        name: { type: string }
        artistId: { type: string }
        artistName: { type: string }
        year: { type: integer }
        genre: { type: string }
        coverArt: { type: string }
        active: { type: boolean }
        artists:
          type: array
          items: { type: string }
        genres:
          type: array
          items: { type: string }
        starred: { type: boolean }
        rating: { type: number }
        explicit: { type: boolean }
    SearchArtist:
      type: object
      required: [id, name, active, starred]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        starred: { type: boolean }
        rating: { type: number }
    SearchPlaylist:
      type: object
      description: '`songIds` stays empty; `songCount` carries the count.'
      required: [id, name, ownerId, ownerUsername, visibility, isSmart, createdAt, updatedAt, songIds, songCount, starred]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        ownerUsername: { type: string }
        visibility: { $ref: '#/components/schemas/PlaylistVisibility' }
        shareToken: { type: string }
        isSmart: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
        songIds:
          type: array
          items: { type: string }
        songCount: { type: integer }
        starred: { type: boolean }
        rating: { type: number }
    SearchResults:
      type: object
      description: 'The envelope always carries all four categories; unasked categories come back empty (never null).'
      required: [songs, albums, artists, playlists]
      properties:
        songs:
          type: array
          items: { $ref: '#/components/schemas/SearchSong' }
        albums:
          type: array
          items: { $ref: '#/components/schemas/SearchAlbum' }
        artists:
          type: array
          items: { $ref: '#/components/schemas/SearchArtist' }
        playlists:
          type: array
          items: { $ref: '#/components/schemas/SearchPlaylist' }
    # --- statistics ----------------------------------------------------------
    StatisticsTotals:
      type: object
      required: [totalPlays, totalDurationListened, favoriteSongs, favoriteAlbums, favoriteArtists]
      properties:
        totalPlays: { type: integer }
        totalDurationListened: { type: integer, description: Seconds. }
        favoriteSongs: { type: integer }
        favoriteAlbums: { type: integer }
        favoriteArtists: { type: integer }
    TopSongItem:
      type: object
      required: [songId, title, plays]
      properties:
        songId: { type: string }
        title: { type: string }
        artistName: { type: string }
        albumCoverArt: { type: string }
        plays: { type: integer }
    TopArtistItem:
      type: object
      required: [artistName, plays]
      properties:
        artistId: { type: string }
        artistName: { type: string }
        plays: { type: integer }
    TopAlbumItem:
      type: object
      required: [albumName, plays]
      properties:
        albumId: { type: string }
        albumName: { type: string }
        artistName: { type: string }
        coverArt: { type: string }
        plays: { type: integer }
    GenreDistributionItem:
      type: object
      required: [genre, plays, totalDurationListened]
      properties:
        genre: { type: string }
        plays: { type: integer }
        totalDurationListened: { type: integer }
    TopYearItem:
      type: object
      required: [year, plays, totalDurationListened]
      properties:
        year: { type: integer }
        plays: { type: integer }
        totalDurationListened: { type: integer }
    StatisticsTopLists:
      type: object
      required: [topSongs, topArtists, topAlbums, topGenres, topYears]
      properties:
        topSongs:
          type: array
          items: { $ref: '#/components/schemas/TopSongItem' }
        topArtists:
          type: array
          items: { $ref: '#/components/schemas/TopArtistItem' }
        topAlbums:
          type: array
          items: { $ref: '#/components/schemas/TopAlbumItem' }
        topGenres:
          type: array
          items: { $ref: '#/components/schemas/GenreDistributionItem' }
        topYears:
          type: array
          items: { $ref: '#/components/schemas/TopYearItem' }
    RatedArtistItem:
      type: object
      required: [artistName, averageRating, bayesianAverage, ratedSongs]
      properties:
        artistId: { type: string }
        artistName: { type: string }
        averageRating: { type: number }
        bayesianAverage: { type: number }
        ratedSongs: { type: integer }
    TopRatedGenreItem:
      type: object
      required: [genre, averageRating, bayesianAverage, ratedSongs]
      properties:
        genre: { type: string }
        averageRating: { type: number }
        bayesianAverage: { type: number }
        ratedSongs: { type: integer }
    TopRatedYearItem:
      type: object
      required: [year, averageRating, bayesianAverage, ratedSongs]
      properties:
        year: { type: integer }
        averageRating: { type: number }
        bayesianAverage: { type: number }
        ratedSongs: { type: integer }
    StatisticsRatedLists:
      type: object
      required: [topRatedArtists, topRatedGenres, topRatedYears]
      properties:
        topRatedArtists:
          type: array
          items: { $ref: '#/components/schemas/RatedArtistItem' }
        topRatedGenres:
          type: array
          items: { $ref: '#/components/schemas/TopRatedGenreItem' }
        topRatedYears:
          type: array
          items: { $ref: '#/components/schemas/TopRatedYearItem' }
    RatingDistributionItem:
      type: object
      required: [rating, count]
      properties:
        rating: { type: integer }
        count: { type: integer }
    StatisticsCharts:
      type: object
      required: [ratingDistribution]
      properties:
        ratingDistribution:
          type: object
          required: [unrated, ratings]
          properties:
            unrated: { type: integer }
            ratings:
              type: array
              items: { $ref: '#/components/schemas/RatingDistributionItem' }
    MonthlyPlaysItem:
      type: object
      required: [month, plays]
      properties:
        month: { type: string }
        plays: { type: integer }
    MonthlyGroupedItem:
      type: object
      description: One month of a grouped breakdown (top 6 groups plus an "Other" rollup).
      required: [month, groups]
      properties:
        month: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [key, plays]
            properties:
              key: { type: string }
              plays: { type: integer }
    UserStatistics:
      type: object
      required: [userId, username, range, totals, top, rated, charts, monthlyPlays]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        range: { $ref: '#/components/schemas/TimeRange' }
        totals: { $ref: '#/components/schemas/StatisticsTotals' }
        top: { $ref: '#/components/schemas/StatisticsTopLists' }
        rated: { $ref: '#/components/schemas/StatisticsRatedLists' }
        charts: { $ref: '#/components/schemas/StatisticsCharts' }
        monthlyPlays:
          type: array
          items: { $ref: '#/components/schemas/MonthlyPlaysItem' }
    UserSummary:
      type: object
      required: [userId, username, totalPlays, totalDurationListened, uniqueSongs]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        totalPlays: { type: integer }
        totalDurationListened: { type: integer }
        uniqueSongs: { type: integer }
    OverallStatistics:
      type: object
      required: [range, totals, top, rated, charts, monthlyPlays, userSummaries]
      properties:
        range: { $ref: '#/components/schemas/TimeRange' }
        totals: { $ref: '#/components/schemas/StatisticsTotals' }
        top: { $ref: '#/components/schemas/StatisticsTopLists' }
        rated: { $ref: '#/components/schemas/StatisticsRatedLists' }
        charts: { $ref: '#/components/schemas/StatisticsCharts' }
        monthlyPlays:
          type: array
          items: { $ref: '#/components/schemas/MonthlyPlaysItem' }
        userSummaries:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
    # --- home ----------------------------------------------------------------
    HomeAlbumCard:
      type: object
      required: [id, name, active, starred]
      properties:
        id: { type: string }
        name: { type: string }
        artistId: { type: string }
        artistName: { type: string }
        year: { type: integer }
        genre: { type: string }
        coverArt: { type: string }
        active: { type: boolean }
        artists:
          type: array
          items: { type: string }
        genres:
          type: array
          items: { type: string }
        starred: { type: boolean }
        rating: { type: number }
    HomeSongCard:
      type: object
      required: [id, title, explicit, mtime, starred]
      properties:
        id: { type: string }
        title: { type: string }
        artistId: { type: string }
        artistName: { type: string }
        albumId: { type: string }
        albumName: { type: string }
        duration: { type: integer }
        year: { type: integer }
        genre: { type: string }
        explicit: { type: boolean }
        coverArt: { type: string }
        mtime: { type: integer, format: int64 }
        artists:
          type: array
          items: { type: string }
        genres:
          type: array
          items: { type: string }
        starred: { type: boolean }
        rating: { type: number }
    HomeGenreCard:
      type: object
      description: One ranked genre — the name and its in-scope active song count.
      required: [name, songCount]
      properties:
        name: { type: string }
        songCount: { type: integer }
    HomeResponse:
      type: object
      description: All five sections are always present (possibly empty arrays).
      required: [genres, mostPlayed, random, recentAdditions, recentlyPlayed]
      properties:
        genres:
          type: array
          items: { $ref: '#/components/schemas/HomeGenreCard' }
        mostPlayed:
          type: array
          items: { $ref: '#/components/schemas/HomeAlbumCard' }
        random:
          type: array
          items: { $ref: '#/components/schemas/HomeAlbumCard' }
        recentlyAdded:
          type: array
          description: Albums whose newest song file is most recently touched, first.
          items: { $ref: '#/components/schemas/HomeAlbumCard' }
        recentlyPlayed:
          type: array
          items: { $ref: '#/components/schemas/HomeAlbumCard' }
    # --- auto-dj / players ---------------------------------------------------
    AutoDjSong:
      type: object
      description: Display subset of the catalog song DTO plus the caller's interaction state.
      required: [id, title, explicit, mtime, starred]
      properties:
        id: { type: string }
        title: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        duration: { type: integer }
        artistId: { type: string }
        artistName: { type: string }
        albumId: { type: string }
        albumName: { type: string }
        genre: { type: string }
        genreId: { type: string }
        year: { type: integer }
        explicit: { type: boolean }
        coverArt: { type: string }
        mtime: { type: integer, format: int64 }
        starred: { type: boolean }
        rating: { type: number }
    PlayerInfo:
      type: object
      description: >
        One live player entry (user + device). `userId` is absent for
        anonymous share-token streams. Entries expire 5 minutes after their
        last stream heartbeat; a restart clears the registry.
      required: [id, clientId, songId, songTitle, startedAt, updatedAt]
      properties:
        id: { type: string, description: '`userId|clientId` registry key.' }
        userId: { type: string }
        clientId: { type: string }
        songId: { type: string }
        songTitle: { type: string }
        artistName: { type: string }
        albumName: { type: string }
        durationSeconds: { type: integer }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    # --- uploads / ingest ----------------------------------------------------
    UploadSessionCreated:
      type: object
      required: [sessionId, libraryId]
      properties:
        sessionId: { type: string }
        libraryId: { type: string }
        duplicateStrategy: { $ref: '#/components/schemas/DuplicateStrategy' }
    UploadSessionStatus:
      type: object
      required: [sessionId, libraryId, createdAt, files, reassembled]
      properties:
        sessionId: { type: string }
        libraryId: { type: string }
        createdAt: { type: string, format: date-time }
        files:
          type: array
          description: Per-file chunk reception state.
          items:
            type: object
            required: [fileId, chunksReceived, chunkBytes]
            properties:
              fileId: { type: string }
              chunksReceived: { type: integer }
              chunkBytes: { type: integer, format: int64 }
        reassembled:
          type: array
          description: Reassembled files with sizes.
          items:
            type: object
            required: [path, size]
            properties:
              path: { type: string }
              size: { type: integer, format: int64 }
        duplicateStrategy: { $ref: '#/components/schemas/DuplicateStrategy' }
    IngestJob:
      type: object
      required: [id, runId, sourcePath, status, duplicate, createdAt, updatedAt]
      properties:
        id: { type: string }
        runId: { type: string }
        sourcePath: { type: string }
        status: { type: string, enum: [pending, needs_review, imported, skipped, failed] }
        targetPath: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        duplicate: { type: boolean }
        duplicateStrategy:
          anyOf:
            - { $ref: '#/components/schemas/DuplicateStrategy' }
            - { type: 'null' }
        createdAt: { type: string }
        updatedAt: { type: string }
    Conflict:
      type: object
      description: One collision candidate — an active song parked on a ` (n)` collision path.
      required: [id, filePath, title]
      properties:
        id: { type: string }
        filePath: { type: string }
        title: { type: string }
        artistName: { type: string }
        albumName: { type: string }
