# Redocly lint configuration for the Sonarly native API contract.
# Run: npx @redocly/cli lint openapi.yaml
extends:
  - recommended
rules:
  # /health, /ready and /api/logout genuinely have no 4xx response: the
  # probes either answer 200 or 5xx, and logout always answers {ok:true}.
  operation-4xx-response: off
  # The spec is hand-maintained next to the Go DTOs; descriptions carry the
  # parity notes the web client audit needs, so the prose rules stay off.
  tags-alphabetical: off
  operation-summary: error
  no-unused-components: error
