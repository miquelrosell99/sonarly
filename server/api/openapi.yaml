  /api/settings/media:
    get:
      operationId: getMediaSettings
      tags: [ingest]
      summary: Media settings with pattern templates (admin)
      responses:
        '200':
          description: The effective settings plus the template presets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: patchMediaSettings
      tags: [ingest]
      summary: Update media settings (admin)
      description: >
        Every field is optional; the pattern must be relative with no `..`
        segments, the strategy must be a known DuplicateStrategy, and the
        retention clamps to 1–365. Answers the effective settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizePattern: { type: string, minLength: 1 }
                duplicateStrategy: { $ref: '#/components/schemas/DuplicateStrategy' }
                reviewRetentionDays: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: The effective settings after the patch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSettingsWithoutTemplates' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/organize:
